[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "p6cli"
dynamic = ["version"]
description = "Cliente de terminal, de solo lectura, para la API REST de Oracle Primavera P6 EPPM"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32",
    "keyring>=25",
    "platformdirs>=4",
    "tomli-w>=1",
    "typer>=0.12",
    "questionary>=2",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.32",
    "pre-commit>=3.8",
]

[project.scripts]
p6 = "p6cli.cli.app:main"

[tool.hatch.version]
path = "src/p6cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/p6cli"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
# Los bloques de código en la documentación conservan su alineación manual.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["p6cli"]
branch = true
